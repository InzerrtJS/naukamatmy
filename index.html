<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz – prototyp</title>

<!-- KaTeX: wyświetlanie wzorów w treści pytań i odpowiedzi -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<!-- GeoGebra Apps API -->
<script async src="https://www.geogebra.org/apps/deployggb.js"></script>

<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #657084;
    --line: #dde1e8; --accent: #2457d6; --ok: #1c7c4a; --ok-bg: #e6f4ec;
    --bad: #b3261e; --bad-bg: #fbe9e7; --info: #7a5b00; --info-bg: #fff4d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171d; --card: #1c212b; --text: #e8ebf1; --muted: #98a2b5;
      --line: #313846; --accent: #7aa2ff; --ok: #6fd39b; --ok-bg: #16301f;
      --bad: #ff8f86; --bad-bg: #3a1c1a; --info: #f0cf6a; --info-bg: #35290d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center;
           justify-content: space-between; padding: 14px 20px;
           background: var(--card); border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 1.15rem; }
  nav { display: flex; gap: 6px; flex-wrap: wrap; }
  nav button { border: 1px solid var(--line); background: transparent; color: var(--text);
               padding: 7px 14px; border-radius: 8px; cursor: pointer; font: inherit; }
  nav button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { max-width: 780px; margin: 0 auto; padding: 20px 16px 60px; }
  main.wide { max-width: 1060px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
  .meta { color: var(--muted); font-size: .85rem; margin-bottom: 6px; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; margin-bottom: 14px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); transition: width .25s; }
  .prompt { font-size: 1.1rem; margin-bottom: 14px; }
  .body { margin-bottom: 16px; }
  .opt { display: flex; gap: 10px; align-items: center; padding: 10px 12px; margin-bottom: 8px;
         border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
  .opt:hover { border-color: var(--accent); }
  .opt input { width: 18px; height: 18px; accent-color: var(--accent); }
  input[type=text], input[type=number], select, textarea {
         width: 100%; padding: 9px 12px; font: inherit; color: var(--text);
         background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
  textarea { min-height: 150px; resize: vertical; }
  math-field { display: block; width: 100%; font-size: 1.3rem; padding: 8px 12px; color: var(--text);
         background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
  .hint { color: var(--muted); font-size: .85rem; margin-top: 6px; }
  .ggb { max-width: 100%; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; min-height: 120px; }
  button.primary { background: var(--accent); color: #fff; border: 0; padding: 10px 22px;
         border-radius: 10px; font: inherit; font-weight: 600; cursor: pointer; }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--line);
         padding: 9px 18px; border-radius: 10px; font: inherit; cursor: pointer; }
  button.small { padding: 3px 9px; font-size: .85rem; border-radius: 8px; }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .4; cursor: default; }
  .feedback { margin: 0 0 16px; padding: 12px 14px; border-radius: 10px; }
  .feedback.correct { background: var(--ok-bg); color: var(--ok); }
  .feedback.wrong { background: var(--bad-bg); color: var(--bad); }
  .feedback.manual { background: var(--info-bg); color: var(--info); }
  .feedback strong { display: block; margin-bottom: 4px; }
  .feedback div { color: var(--text); }
  .score { font-size: 2.4rem; font-weight: 700; margin: 4px 0 10px; }
  .nav { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; }
  .slide h2 { margin-top: 0; }

  /* ---- edytor ---- */
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .toolbar select { width: auto; }
  .toolbar .status { color: var(--muted); font-size: .85rem; margin-left: auto; }
  .toolbar .status.bad { color: var(--bad); }
  .editor { display: grid; grid-template-columns: 290px 1fr; gap: 16px; align-items: start; }
  @media (max-width: 760px) { .editor { grid-template-columns: 1fr; } }
  .qlist { display: flex; flex-direction: column; gap: 6px; }
  .qrow { display: flex; gap: 6px; align-items: center; padding: 8px 10px; background: var(--card);
          border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
  .qrow.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .qrow .t { flex: 1; min-width: 0; }
  .qrow .t b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qrow .t span { font-size: .75rem; color: var(--muted); }
  .qrow .warn { color: var(--bad); font-weight: 700; }
  .field { margin-bottom: 14px; }
  .field > label { display: block; font-weight: 600; margin-bottom: 4px; font-size: .9rem; }
  .editor textarea { min-height: 0; }
  .preview { margin-top: 6px; padding: 8px 12px; border: 1px dashed var(--line); border-radius: 10px; min-height: 2em; }
  .optrow { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .optrow input[type=text] { flex: 1; }
  .optrow input[type=radio], .optrow input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
  .numrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .problems { margin: 0 0 14px; padding: 10px 14px 10px 30px; background: var(--info-bg); color: var(--info); border-radius: 10px; }

  /* ---- podpowiedzi ---- */
  .hintlist { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .hintitem { padding: 10px 14px; border-radius: 10px; background: var(--info-bg); color: var(--text);
              border-left: 4px solid var(--info); }
  .hintctl { margin-bottom: 16px; }
  .hintrow { display: grid; grid-template-columns: 24px 1fr auto; gap: 8px; align-items: start; margin-bottom: 10px; }
  .hintrow .hn { font-weight: 600; color: var(--muted); padding-top: 8px; }
  .hintrow .hbtns { display: flex; gap: 4px; padding-top: 4px; }
  .mini { margin-top: 8px; padding: 10px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  .miniq { font-weight: 600; margin-bottom: 8px; }
  .mini .opt { margin-bottom: 6px; }
  .opt.ok { border-color: var(--ok); background: var(--ok-bg); }
  .opt.bad { border-color: var(--bad); background: var(--bad-bg); opacity: .75; }
  .minifb { margin-top: 4px; font-size: .9rem; min-height: 1.3em; }
  .minifb.ok { color: var(--ok); } .minifb.bad { color: var(--bad); }
  .mini-box { margin-top: 8px; padding: 12px; border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 10px; }
  .mini-box .field { margin-bottom: 8px; }
  /* ---- logowanie, tabele, widoki nauczyciela i ucznia ---- */
  header .userbox { display: flex; gap: 10px; align-items: center; font-size: .9rem; color: var(--muted); margin-left: auto; }
  .login { max-width: 380px; margin: 40px auto 12px; }
  .login h2 { margin-top: 0; }
  .loginerr { color: var(--bad); min-height: 1.4em; margin-bottom: 8px; font-size: .9rem; }
  .loginalt { max-width: 380px; margin: 0 auto; text-align: center; }
  .note { padding: 10px 14px; border-radius: 10px; background: var(--info-bg); color: var(--info); margin-bottom: 14px; font-size: .9rem; }
  .note.bad { background: var(--bad-bg); color: var(--bad); }
  .note.good { background: var(--ok-bg); color: var(--ok); }
  .tablewrap { overflow-x: auto; }
  .tbl { width: 100%; border-collapse: collapse; font-size: .9rem; }
  .tbl th, .tbl td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .tbl th { color: var(--muted); font-weight: 600; white-space: nowrap; }
  .tbl tr.click { cursor: pointer; }
  .tbl tr.click:hover, .tbl tr.sel { background: var(--bg); }
  .tbl input[type=text], .tbl input[type=number] { padding: 5px 8px; }
  .part { border-left: 3px solid var(--line); padding: 4px 0 4px 12px; margin: 12px 0; }
  .part.ok { border-color: var(--ok); } .part.bad { border-color: var(--bad); } .part.manual { border-color: var(--info); }
  .ptitle { margin-bottom: 6px; }
  .pmark { font-size: .85rem; font-weight: 600; margin-top: 4px; } .part.ok .pmark { color: var(--ok); } .part.bad .pmark { color: var(--bad); }
  .pexp { font-size: .9rem; color: var(--muted); margin-top: 2px; }
  .opt.more { margin: 10px 0 0; font-weight: 600; }
  [hidden] { display: none !important; }
  .tagfilter { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; margin-bottom: 8px; }
  .tagfilter select { max-width: 100%; }
  .tf { display: flex; gap: 18px; flex-wrap: wrap; }
  .phead { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 4px 2px 10px; border-radius: 999px; font-size: .8rem; background: var(--bg); border: 1px solid var(--line); }
  .chip.ro { padding: 1px 8px; font-size: .7rem; color: var(--muted); }
  .chip button { border: 0; background: none; cursor: pointer; color: var(--muted); font-size: .9rem; padding: 0 6px; line-height: 1; }
  .qrow .tg { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .75rem; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .badge.on { color: var(--ok); border-color: var(--ok); }
  .badge.warn { color: var(--info); border-color: var(--info); }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
  .filters select, .filters input[type=text] { width: auto; }
  .filters label { display: flex; gap: 6px; align-items: center; font-size: .9rem; }
  .pick { max-height: 260px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; padding: 6px; margin-bottom: 8px; }
  .pickrow { display: flex; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 8px; }
  .pickrow .t { flex: 1; min-width: 0; }
  .pickrow .ptxt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-height: 3.6em; line-height: 1.5; }
  .pickrow .ptxt .katex-display { margin: 0; display: inline-block; }
  .pickrow input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
  .setcard { margin-bottom: 12px; }
  .setcard h3 { margin: 0 0 4px; }
  .rowbtns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .detail { margin-top: 16px; }
  .detail textarea { min-height: 0; }
  .grade { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; }
  .grade input[type=number] { width: 90px; }
  .grade textarea { flex: 1; min-width: 160px; }
  .sumrow { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; border-top: 1px solid var(--line); }
  .sumrow .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sumrow .st { font-size: .85rem; white-space: nowrap; }
  .sumrow .st.correct { color: var(--ok); } .sumrow .st.wrong { color: var(--bad); } .sumrow .st.manual { color: var(--info); }
  .sumrow .hn2 { font-size: .85rem; color: var(--muted); white-space: nowrap; min-width: 4.5em; text-align: right; }
</style>
</head>
<body>
<header>
  <h1>Quiz <small id="ver" style="font-size:.5em;font-weight:400;opacity:.6"></small></h1>
  <nav id="nav"></nav>
  <div class="userbox" id="userbox"></div>
</header>
<main>
  <section id="login" hidden></section>
  <section id="home" hidden></section>
  <section id="quiz" hidden></section>
  <section id="slides" hidden></section>
  <section id="editor" hidden></section>
  <section id="sets" hidden></section>
  <section id="results" hidden></section>
  <section id="students" hidden></section>
</main>

<script type="module">
/* ==========================================================================
   DANE DOMYŚLNE – używane, dopóki w przeglądarce nie ma zapisanych pytań.
   Wzory zapisujemy w LaTeX-u między znakami $ ... $.
   ========================================================================== */
const DEFAULT_QUESTIONS = [
  { id: 'q1', type: 'single',
    prompt: 'Ile wynosi pochodna funkcji $f(x)=x^2$?',
    options: ['$x$', '$2x$', '$x^2$', '$2$'], correct: 1,
    hints: ['Przypomnij sobie wzór na pochodną funkcji potęgowej $x^n$.',
            'Wykładnik zjeżdża przed $x$, a nowy wykładnik jest o 1 mniejszy.'],
    explanation: 'Z wzoru $(x^n)\'=n\\,x^{n-1}$ dla $n=2$ dostajemy $2x$.' },

  { id: 'q2', type: 'multi',
    prompt: 'Zaznacz wszystkie liczby pierwsze.',
    options: ['$2$', '$9$', '$11$', '$15$'], correct: [0, 2],
    explanation: '$9=3\\cdot3$ oraz $15=3\\cdot5$ są złożone.' },

  { id: 'q3', type: 'short_text',
    prompt: 'Jak nazywa się stolica Polski?',
    accepted: ['Warszawa'],
    explanation: 'Stolicą Polski jest Warszawa.' },

  { id: 'q4', type: 'short_math',
    prompt: 'Uprość wyrażenie: $(x+1)^2-(x-1)^2$',
    expected: ['4x'], vars: ['x'], form: 'expanded',
    hints: ['Rozwiń oba kwadraty ze wzoru $(a\\pm b)^2=a^2\\pm2ab+b^2$.',
            'Po rozwinięciu odejmij wyrażenia i zredukuj wyrazy podobne.',
            'Zostaje tylko wyraz z $2ab$, wystąpi dwa razy.'],
    explanation: '$(x+1)^2-(x-1)^2 = 4x$.' },

  { id: 'q5', type: 'long',
    prompt: 'Wyjaśnij własnymi słowami, czym jest pochodna funkcji i do czego służy.',
    model: 'Pochodna opisuje chwilową szybkość zmian funkcji w danym punkcie – geometrycznie jest to współczynnik kierunkowy stycznej do wykresu. Służy m.in. do badania monotoniczności i szukania ekstremów.',
    explanation: '' },

  { id: 'q6', type: 'geogebra',
    prompt: 'Przesuń punkt $A$ w to miejsce, w którym prosta $y=2x+1$ przecina oś $Oy$.',
    setup: ['ShowGrid(true)', 'f(x)=2x+1', 'A=(3,-2)', 'SetColor(A,"Red")', 'SetPointSize(A,6)',
            'ZoomIn(-6,-6,6,6)'],
    target: { object: 'A', x: 0, y: 1, tol: 0.25 },
    explanation: 'Dla $x=0$ mamy $y=2\\cdot0+1=1$, czyli punkt $(0,\\,1)$.' },

  // przykład podpowiedzi z mini-pytaniem (druga podpowiedź jest samym pytaniem)
  { id: 'q7', type: 'short_math',
    prompt: 'Wyznacz wzór funkcji kwadratowej $f(x)=2(x-1)^2-3$ w postaci ogólnej.',
    expected: ['2x^2-4x-1'], vars: ['x'], form: 'expanded',
    hints: [
      'Skorzystaj ze wzoru skróconego mnożenia.',
      { text: '', mini: { prompt: 'Z którego wzoru skróconego mnożenia należy skorzystać?',
          options: ['$(a+b)^2=a^2+2ab+b^2$', '$(a-b)^2=a^2-2ab+b^2$', '$a^2-b^2=(a-b)(a+b)$'], correct: 1 } },
      'Rozwiń $(x-1)^2$, pomnóż wynik przez 2 i odejmij 3.'
    ],
    explanation: '$2(x-1)^2-3=2(x^2-2x+1)-3=2x^2-4x-1$.' }
];

const SLIDES = [
  { title: 'Czym jest pochodna?',
    text: 'Pochodna funkcji w punkcie opisuje chwilową szybkość jej zmian:\n$$f\'(x_0)=\\lim_{h\\to0}\\frac{f(x_0+h)-f(x_0)}{h}$$' },
  { title: 'Wpływ parametru $a$ na parabolę',
    text: 'Przesuń suwak $a$ i zobacz, jak zmienia się wykres funkcji $f(x)=a\\,x^2$.',
    ggb: { setup: ['a=1', 'f(x)=a*x^2', 'SetVisibleInView(a,1,true)', 'ShowGrid(true)', 'ZoomIn(-6,-4,6,8)'], height: 400 } },
  { title: 'Podsumowanie',
    text: 'Dla $a>0$ ramiona paraboli skierowane są w górę, dla $a<0$ w dół, a dla $a=0$ wykres jest prostą $y=0$.' }
];

const TYPE_LABEL = {
  single: 'Jednokrotny wybór', multi: 'Wielokrotny wybór',
  short_text: 'Krótka odpowiedź (tekst)', short_math: 'Krótka odpowiedź (wyrażenie)',
  long: 'Długa odpowiedź', geogebra: 'Zadanie z GeoGebrą',
  truefalse: 'Prawda / fałsz', group: 'Zadanie z kilkoma poleceniami (części a, b, c…)'
};
// typy dozwolone jako części zadania z kilkoma poleceniami (bez GeoGebry i bez zagnieżdżania)
const PART_TYPES = ['truefalse', 'single', 'multi', 'short_text', 'short_math', 'long'];
const MAX_PARTS = 10;
const partLetter = i => String.fromCharCode(97 + i) + ')';

/* ==========================================================================
   CZYSTA LOGIKA (bez DOM) – sprawdzanie odpowiedzi i model danych pytań
   ========================================================================== */
// <pure>
const norm = s => String(s ?? '').trim().toLowerCase().replace(/\s+/g, ' ');
const normLatex = s => String(s ?? '').replace(/\\left|\\right|\\,|\\;|\\!|\s+/g, '').replace(/\\cdot|\\times/g, '*');
const sameSet = (a, b) => a.length === b.length && a.every(v => b.includes(v));
const SAMPLES = [-2.3, -1.1, 0.7, 1.9, 3.3, 4.1];

function numOf(e) {
  if (e == null) return NaN;
  if (typeof e === 'number') return e;
  if (typeof e.re === 'number') {
    const im = typeof e.im === 'number' ? e.im : 0;
    return Math.abs(im) < 1e-9 ? e.re : NaN;
  }
  try { const v = Number(e.valueOf()); if (!Number.isNaN(v)) return v; } catch {}
  return NaN;
}

function evalAt(ce, expr, vals) {
  try { if (typeof expr.subs === 'function') return numOf(expr.subs(vals).N()); } catch {}
  try { for (const k in vals) ce.assign(k, vals[k]); return numOf(expr.N()); } catch {}
  return NaN;
}

// Równoważność dwóch wyrażeń: próbkowanie numeryczne w kilku punktach.
function mathEqual(ce, a, b, vars = ['x']) {
  if (!norm(a)) return false;
  if (normLatex(a) === normLatex(b)) return true;
  if (!ce) return false;
  try {
    const ea = ce.parse(a), eb = ce.parse(b);
    if (ea.isValid === false || eb.isValid === false) return false;
    let valid = 0;
    for (const s of SAMPLES) {
      const vals = {};
      vars.forEach((v, i) => { vals[v] = s + i * 0.37; });
      const x = evalAt(ce, ea, vals), y = evalAt(ce, eb, vals);
      if (!Number.isFinite(x) || !Number.isFinite(y)) continue;
      if (Math.abs(x - y) > 1e-6 * (1 + Math.abs(x) + Math.abs(y))) return false;
      valid++;
    }
    if (valid >= 3) return true;
    try { return ea.isEqual(eb) === true; } catch {}
  } catch (e) { console.warn('mathEqual:', e); }
  return false;
}

// ---- wymagana postać wyniku (pytania z odpowiedzią matematyczną) ----
const FORMS = {
  any: 'Dowolna (matematycznie równoważna)',
  expanded: 'Ogólna / rozwinięta (bez nawiasów)',
  canonical: 'Kanoniczna: a(x−p)²+q',
  factored: 'Iloczynowa (iloczyn czynników)',
  exact: 'Dokładnie taki zapis jak wzorzec'
};
const FORM_NAME = { expanded: 'ogólna (rozwinięta)', canonical: 'kanoniczna', factored: 'iloczynowa', exact: 'taka jak wzorzec' };
const FORM_HELP = {
  any: 'Uznawana jest każda postać matematycznie równoważna ze wzorcem.',
  expanded: 'Wynik musi być równoważny ze wzorcem, zapisany bez nawiasów i ze zredukowanymi wyrazami podobnymi, np. 2x²−4x−1.',
  canonical: 'Wynik musi być równoważny ze wzorcem i mieć postać a(x−p)²+q: jeden nawias z jedną zmienną podniesiony do kwadratu plus ewentualnie stała.',
  factored: 'Wynik musi być równoważny ze wzorcem i zapisany jako iloczyn czynników, np. 2(x−1)(x+3). Suma wyrazów na najwyższym poziomie nie jest uznawana.',
  exact: 'Zapis ucznia musi być identyczny ze wzorcem (spacje i \\left \\right są ignorowane). Używaj tylko, gdy zależy Ci na konkretnym zapisie.'

    else holder.textContent = 'Nie udało się załadować GeoGebry (sprawdź połączenie z internetem).';
  })();
}

/* ==========================================================================
   TYPY PYTAŃ: build() rysuje pole odpowiedzi i zwraca funkcję odczytu,
   grade() ocenia odpowiedź.
   ========================================================================== */
const TYPES = {
  single: {
    build(q, box) {
      q.options.forEach((o, i) => box.append(h('label', { class: 'opt' },
        h('input', { type: 'radio', name: q.id, value: String(i) }), rich('span', o))));
      return () => { const c = box.querySelector('input:checked'); return c ? +c.value : null; };
    },
    grade: (q, v) => ({ status: v === q.correct ? 'correct' : 'wrong' })
  },
  multi: {
    build(q, box) {
      q.options.forEach((o, i) => box.append(h('label', { class: 'opt' },
        h('input', { type: 'checkbox', value: String(i) }), rich('span', o))));
      return () => [...box.querySelectorAll('input:checked')].map(c => +c.value);
    },
    grade: (q, v) => ({ status: sameSet(v, q.correct) ? 'correct' : 'wrong' })
  },
  truefalse: {
    build(q, box) {
      box.append(h('div', { class: 'tf' }, [['true', 'Prawda'], ['false', 'Fałsz']].map(([v, t]) =>
        h('label', { class: 'opt' }, h('input', { type: 'radio', name: q.id, value: v }), h('span', {}, t)))));
      return () => { const c = box.querySelector('input:checked'); return c ? c.value === 'true' : null; };
    },
    grade: (q, v) => ({ status: v === q.correct ? 'correct' : 'wrong' })
  },
  group: {
    build(q, box) {
      const getters = q.parts.map((pt, i) => {
        const body = h('div', { class: 'pbody' });
        box.append(h('div', { class: 'part' }, h('div', { class: 'ptitle' }, h('b', {}, partLetter(i) + ' '), rich('span', pt.prompt)), body));
        return TYPES[pt.type].build(pt, body);
      });
      return () => getters.map(g => g());
    },
    grade(q, v) {
      const parts = q.parts.map((pt, i) => TYPES[pt.type].grade(pt, Array.isArray(v) ? v[i] : undefined));
      const auto = parts.filter(r => r.status !== 'manual');
      const okN = auto.filter(r => r.status === 'correct').length;
      const status = parts.some(r => r.status === 'manual') ? 'manual' : (okN === auto.length ? 'correct' : 'wrong');
      return { status, parts, extra: auto.length ? `Poprawne części oceniane automatycznie: ${okN} z ${auto.length}.` : '' };
    },
    reveal(q, body, r) {
      body.querySelectorAll('.part').forEach((el, i) => {
        const pr = r.parts[i], pt = q.parts[i];
        el.classList.add(pr.status === 'correct' ? 'ok' : pr.status === 'manual' ? 'manual' : 'bad');
        el.append(h('div', { class: 'pmark' }, { correct: '✓ Dobrze', wrong: '✗ Źle', manual: 'do oceny przez nauczyciela' }[pr.status]),
          ...(pt.explanation ? [rich('div', pt.explanation, 'pexp')] : []), ...(pr.extra ? [rich('div', pr.extra, 'pexp')] : []));
      });
    },
    // czytelny zapis odpowiedzi do bazy (z treścią części i oceną każdej z nich)
    pack(q, v, r) {
      const show = (pt, x) => {
        if (pt.type === 'single') return Number.isInteger(x) ? String(pt.options[x] ?? '') : '';
        if (pt.type === 'multi') return (Array.isArray(x) ? x : []).map(i => pt.options[i]).join('; ');
        if (pt.type === 'truefalse') return x === true ? 'Prawda' : x === false ? 'Fałsz' : '';
        return String(x ?? '');
      };
      return { parts: q.parts.map((pt, i) => ({ prompt: plainTitle(pt), answer: show(pt, Array.isArray(v) ? v[i] : undefined), status: r.parts[i].status })) };
    }
  },
  short_text: {
    build(q, box) {
      const inp = h('input', { type: 'text', placeholder: 'Twoja odpowiedź', autocomplete: 'off' });
      box.append(inp);
      return () => inp.value;
    },
    grade: (q, v) => ({ status: q.accepted.map(norm).includes(norm(v)) ? 'correct' : 'wrong' })
  },
  short_math: {
    build(q, box) {
      let get;
      if (HAS_MATHFIELD) {
        const mf = document.createElement('math-field');
        box.append(mf);
        get = () => mf.value;
      } else {
        const inp = h('input', { type: 'text', placeholder: 'np. 4x lub \\frac{1}{2}' });
        box.append(inp);
        get = () => inp.value;
      }
      return get;
    },
    grade: (q, v) => gradeMath(CE, q, v)
  },
  long: {
    build(q, box) {
      const ta = h('textarea', { placeholder: 'Napisz swoją odpowiedź…' });
      box.append(ta);
      return () => ta.value;
    },
    grade: (q) => ({ status: 'manual', extra: q.model ? 'Wzorcowa odpowiedź: ' + q.model : '' })
  },
  geogebra: {
    build(q, box) {
      let api = null;
      const holder = h('div', { class: 'ggb' });
      box.append(holder);
      mountGGB(holder, q.setup, 360, a => { api = a; });
      return () => api ? { x: api.getXcoord(q.target.object), y: api.getYcoord(q.target.object) } : null;
    },
    grade(q, v) {
      const t = q.target;
      const ok = v && Math.hypot(v.x - t.x, v.y - t.y) <= t.tol;
      return { status: ok ? 'correct' : 'wrong' };
    }
  }
};

const quizEl = document.getElementById('quiz');
// S.hints[i] = liczba podpowiedzi odsłoniętych przez ucznia przy pytaniu i
// (docelowo ta informacja trafi razem z identyfikatorem ucznia do bazy danych)
// S.mini[i][k] = { attempts, solved } dla mini-pytania w k-tej podpowiedzi pytania i
const S = { i: 0, res: [], hints: [], mini: [] };

// Mini-pytanie jednokrotnego wyboru wewnątrz podpowiedzi: od razu mówi, czy odpowiedź jest dobra.
function buildMini(mini, name, qi, hi) {
  const rec = { attempts: 0, solved: false };
  (S.mini[qi] ??= [])[hi] = rec;
  const fbm = h('div', { class: 'minifb' });
  const box = h('div', { class: 'mini' }, rich('div', mini.prompt, 'miniq'));
  if (mini.kind === 'math') {
    let get, field0;
    if (HAS_MATHFIELD) { field0 = document.createElement('math-field'); get = () => field0.value; }
    else { field0 = h('input', { type: 'text', placeholder: 'np. 4x lub \\frac{1}{2}' }); get = () => field0.value; }
    const btn = h('button', { class: 'secondary small', type: 'button' }, 'Sprawdź');
    const check = () => {
      if (rec.solved) return;
      const v = get(); if (!String(v ?? '').trim()) return;
      rec.attempts++;
      const r = gradeMath(CE, { expected: nonEmpty(mini.expected), vars: mini.vars, form: mini.form }, v);
      if (r.status === 'correct') {
        rec.solved = true; btn.disabled = true;
        if (field0.tagName === 'MATH-FIELD') field0.readOnly = true; else field0.disabled = true;
        fbm.className = 'minifb ok'; fbm.textContent = '✓ Dobrze!';
      } else { fbm.className = 'minifb bad'; fbm.textContent = '✗ ' + (r.extra || 'To nie ta odpowiedź – spróbuj jeszcze raz.'); }
    };
    btn.onclick = check;
    field0.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); check(); } });
    box.append(field0, h('div', { style: 'margin-top:6px' }, btn), fbm);
    return box;
  }
  if (mini.kind === 'text') {
    const inp = h('input', { type: 'text', placeholder: 'Krótka odpowiedź', autocomplete: 'off' });
    const btn = h('button', { class: 'secondary small', type: 'button' }, 'Sprawdź');
    const check = () => {
      if (rec.solved || !inp.value.trim()) return;
      rec.attempts++;
      if (miniTextOk(mini, inp.value)) {
        rec.solved = true; inp.disabled = true; btn.disabled = true;
        fbm.className = 'minifb ok'; fbm.textContent = '✓ Dobrze!';
      } else { fbm.className = 'minifb bad'; fbm.textContent = '✗ To nie ta odpowiedź – spróbuj jeszcze raz.'; }
    };
    btn.onclick = check;
    inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); check(); } });
    box.append(h('div', { class: 'optrow' }, inp, btn), fbm);
    return box;
  }
  mini.options.forEach((o, i) => {
    const inp = h('input', { type: 'radio', name, value: String(i) });
    const lab = h('label', { class: 'opt' }, inp, rich('span', o));
    inp.addEventListener('change', () => {
      rec.attempts++;
      if (i === mini.correct) {
        rec.solved = true; lab.classList.add('ok');
        box.querySelectorAll('input').forEach(d => { d.disabled = true; });
        fbm.className = 'minifb ok'; fbm.textContent = '✓ Dobrze!';
      } else {
        lab.classList.add('bad'); inp.disabled = true;
        fbm.className = 'minifb bad'; fbm.textContent = '✗ To nie ta odpowiedź – spróbuj jeszcze raz.';
      }
    });
    box.append(lab);
  });
  box.append(fbm);
  return box;
}
const LABEL = { correct: 'Poprawnie ✓', wrong: 'Niepoprawnie ✗', manual: 'Odpowiedź zapisana – do oceny przez nauczyciela' };

function lock(body) {
  body.querySelectorAll('input,textarea').forEach(d => { d.disabled = true; });
  body.querySelectorAll('math-field').forEach(m => { m.readOnly = true; });
}

// Zapamiętanie w tej przeglądarce, ile podpowiedzi odsłonięto w niezakończonym pytaniu (na wypadek pauzy).
const hintMemoKey = () => `quiz:hints:${QCTX.attemptId}`;
function memoHints(qid, used) {
  if (!QCTX.attemptId) return;
  try { const m = JSON.parse(localStorage.getItem(hintMemoKey()) || '{}'); m[qid] = used; localStorage.setItem(hintMemoKey(), JSON.stringify(m)); } catch (e) { /* brak localStorage */ }
}
function recallHints(qid) {
  try { return Number(JSON.parse(localStorage.getItem(hintMemoKey()) || '{}')[qid]) || 0; } catch (e) { return 0; }
}

function showQuestion() {
  quizEl.replaceChildren();
  if (!QUIZ.length) {
    quizEl.append(h('div', { class: 'card' },
      h('p', {}, QCTX.kind === 'student'
        ? 'Ten zestaw nie ma jeszcze pytań gotowych do rozwiązania.'
        : 'Brak pytań gotowych do użycia. Dodaj je lub popraw w edytorze pytań.')));
    return;
  }
  while (QCTX.done && S.i < QUIZ.length && QCTX.done.has(QUIZ[S.i].id)) S.i++;   // pomiń pytania rozwiązane przed pauzą
  if (S.i >= QUIZ.length) return showSummary();
  const q = QUIZ[S.i], T = TYPES[q.type];
  const body = h('div', { class: 'body' });
  const fb = h('div', { class: 'feedback', hidden: '' });
  const btn = h('button', { class: 'primary' }, 'Sprawdź');

  // podpowiedzi odsłaniane po jednej, w kolejności zapisanej w edytorze
  const hintList = h('div', { class: 'hintlist' });
  const hintBtn = h('button', { class: 'secondary', type: 'button' });
  let used = 0;
  S.hints[S.i] = 0;
  const syncHintBtn = () => {
    hintBtn.textContent = `💡 Pokaż podpowiedź ${used + 1} z ${q.hints.length}`;
    hintBtn.hidden = used >= q.hints.length;
  };
  hintBtn.onclick = () => {
    used++; S.hints[S.i] = used;
    const hn = q.hints[used - 1];
    const item = h('div', { class: 'hintitem' }, h('b', {}, `Podpowiedź ${used}` + (hn.text ? ': ' : '')));
    if (hn.text) item.append(rich('span', hn.text));
    if (hn.mini) item.append(buildMini(hn.mini, `${q.id}-h${used}`, S.i, used - 1));
    hintList.append(item);
    syncHintBtn();
    memoHints(q.id, used);
  };
  syncHintBtn();
  // po wznowieniu odsłoń od razu podpowiedzi, z których uczeń korzystał przed pauzą (liczą się do wyniku)
  const memo = QCTX.attemptId ? recallHints(q.id) : 0;
  for (let k = 0; k < Math.min(memo, q.hints.length); k++) hintBtn.onclick();
  const hintArea = q.hints.length ? [hintList, h('div', { class: 'hintctl' }, hintBtn)] : [];

  const card = h('div', { class: 'card' },
    h('div', { class: 'meta' }, `Pytanie ${S.i + 1} z ${QUIZ.length}`,
      QCTX.attemptId ? h('button', { class: 'secondary small', type: 'button', style: 'float:right', title: 'Zapisz postęp i wróć do listy zestawów – możesz dokończyć później', onclick: () => QCTX.onPause() }, '⏸ Wstrzymaj i wyjdź') : ''),
    rich('div', q.prompt, 'prompt'), body, ...hintArea, fb, btn);
  quizEl.append(h('div', { class: 'bar' }, h('div', { style: `width:${(S.i / QUIZ.length) * 100}%` })), card);
  const get = T.build(q, body);
  const qStart = Date.now();
  let checked = false;
  btn.onclick = () => {
    if (!checked) {
      const value = get();
      const r = T.grade(q, value);
      S.res[S.i] = r.status; checked = true; lock(body); hintBtn.hidden = true;
      hintList.querySelectorAll('input').forEach(d => { d.disabled = true; });
      fb.className = 'feedback ' + r.status; fb.hidden = false;
      fb.replaceChildren(h('strong', {}, LABEL[r.status]),
        ...(q.explanation ? [rich('div', q.explanation)] : []),
        ...(r.extra ? [rich('div', r.extra)] : []));
      T.reveal?.(q, body, r);
      if (QCTX.onWantMore) {          // prośba ucznia o więcej takich zadań (trafia do wyników)
        const cb = h('input', { type: 'checkbox' }), st = h('span', { class: 'hint', style: 'margin-left:8px' });
        cb.addEventListener('change', async () => {
          st.textContent = 'Zapisywanie…';
          const okSave = await QCTX.onWantMore(q, cb.checked);
          st.textContent = okSave ? 'Zapisano ✓' : 'Nie udało się zapisać – spróbuj ponownie.';
        });
        fb.after(h('label', { class: 'opt more' }, cb, h('span', {}, 'Chcę więcej takich zadań'), st));
      }
      btn.textContent = S.i + 1 < QUIZ.length ? 'Dalej' : 'Zobacz wynik';
      // zapis odpowiedzi (tylko w podejściu ucznia): wynik, podpowiedzi i mini-pytania
      QCTX.onAnswer?.({
        q, value: T.pack ? T.pack(q, value, r) : value, status: r.status, hintsUsed: used,
        minis: (S.mini[S.i] || []).map((m, k) => (m ? { hint: k + 1, attempts: m.attempts, solved: m.solved } : null)).filter(Boolean),
        spent: Math.round((Date.now() - qStart) / 1000)
      });
    } else { S.i++; showQuestion(); }
  };
}

function showSummary() {
  const graded = S.res.filter(r => r !== 'manual').length;
  const ok = S.res.filter(r => r === 'correct').length;
  const manual = S.res.length - graded;
  const hintsUsed = S.hints.reduce((a, b) => a + (b || 0), 0);
  const hintsAll = QUIZ.reduce((a, q) => a + q.hints.length, 0);
  const rows = QUIZ.map((q, i) => h('div', { class: 'sumrow' },
    h('span', { class: 't' }, `${i + 1}. ${plainTitle(q)}`),
    h('span', { class: 'st ' + S.res[i] }, { correct: '✓', wrong: '✗', manual: 'do oceny' }[S.res[i]] || ''),
    h('span', { class: 'hn2' }, q.hints.length
      ? `💡 ${S.hints[i] || 0}/${q.hints.length}` + (q.hints.some(x => x.mini)
        ? ` · mini ${(S.mini[i] || []).filter(m => m && m.solved).length}/${q.hints.filter(x => x.mini).length}` : '')
      : '')));
  const minis = S.mini.flat().filter(Boolean);

  // w podejściu ucznia: zapis wyniku w bazie i powrót do listy zestawów
  const student = QCTX.kind === 'student';
  const saveNote = h('p', { class: 'hint' });
  const saveWrap = h('div');
  if (student) {
    const doSave = () => {
      saveWrap.replaceChildren(h('p', { class: 'hint' }, 'Zapisywanie wyniku…'));
      QCTX.onFinish().then(res => {
        if (res.ok) { saveWrap.replaceChildren(h('div', { class: 'note good' }, 'Wynik został zapisany.')); return; }
        saveWrap.replaceChildren(h('div', { class: 'note bad' }, 'Nie udało się zapisać wyniku: ' + res.error + ' '),
          h('button', { class: 'secondary small', type: 'button', onclick: () => { QCTX.resultPromise = null; doSave(); } }, 'Spróbuj ponownie'));
      });
    };
    doSave();
  }
  quizEl.append(h('div', { class: 'card' },
    h('h2', { style: 'margin-top:0' }, 'Wynik'),
    h('div', { class: 'score' }, `${ok} / ${graded}`),
    h('p', {}, manual ? `Pytania otwarte czekające na ocenę nauczyciela: ${manual}.` : 'Wszystkie pytania zostały ocenione automatycznie.'),
    ...(hintsAll ? [h('p', {}, `Wykorzystane podpowiedzi: ${hintsUsed} z ${hintsAll}.`)] : []),
    ...(minis.length ? [h('p', {}, `Mini-pytania w podpowiedziach: rozwiązane ${minis.filter(m => m.solved).length} z ${minis.length} odsłoniętych, łącznie prób: ${minis.reduce((a, m) => a + m.attempts, 0)}.`)] : []),
    h('div', { style: 'margin-bottom:16px' }, rows),
    ...(student ? [saveWrap] : []),
    student
      ? h('button', { class: 'primary', onclick: () => QCTX.onExit() }, 'Wróć do listy zestawów')
      : h('button', { class: 'primary', onclick: () => { resetSession(); showQuestion(); } }, 'Zacznij od nowa')));
}

function renameTagEverywhere(from, to) {
  to = normTags([to])[0]; if (!to) return 0;
  let n = 0;
  questions.forEach(q => {
    if ((q.tags || []).some(t => sameTag(t, from))) { q.tags = normTags(q.tags.map(t => (sameTag(t, from) ? to : t))); n++; }
  });
  return n;

function removeTagEverywhere(tag) {
  let n = 0;
  questions.forEach(q => { const k = (q.tags || []).filter(t => !sameTag(t, tag)); if (k.length !== (q.tags || []).length) { q.tags = k; n++; } });

// Wybór kilku tagów do filtrowania (wspólny dla edytora pytań i składania zestawów).

    } }, 'Zmień nazwę tagu'),
    h('button', { class: 'secondary small danger', type: 'button', onclick: () => {
      const cur = EF.tags[0];
      if (!confirm(`Usunąć tag „${cur}” ze wszystkich pytań? Same pytania zostaną.`)) return;
      removeTagEverywhere(cur); EF.tags = []; commit(); renderForm();
    } }, 'Usuń tag'));
  filterEl = h('div', { class: 'card', style: 'padding:10px;margin-bottom:8px' }, tagBoxEl, textFiltEl, tagToolsEl);
}

function tagsField(q) {
  const wrap = h('div'), chips = h('div', { class: 'chips' });
  const dl = h('datalist', { id: 'taglist' });
  const inp = h('input', { type: 'text', list: 'taglist', placeholder: 'Wpisz tag i naciśnij Enter', maxlength: String(MAX_TAG_LEN) });
  const draw = () => {
    chips.replaceChildren(...q.tags.map(t => h('span', { class: 'chip' }, t,
      h('button', { type: 'button', title: 'Usuń tag', onclick: () => { q.tags = q.tags.filter(x => x !== t); commit(); draw(); } }, '✕'))));
    dl.replaceChildren(...allTags(questions).filter(x => !q.tags.some(t => sameTag(t, x.tag))).map(x => h('option', { value: x.tag })));
  };
  const add = raw => {
    const next = normTags([...q.tags, ...String(raw).split(',')]);
    if (next.length === q.tags.length) { inp.value = ''; return; }
    q.tags = next; inp.value = ''; commit(); draw();
  };
  inp.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ',') { ev.preventDefault(); add(inp.value); } });
  inp.addEventListener('change', () => { if (inp.value.trim()) add(inp.value); });
  draw();
  wrap.append(chips, inp, dl);
  return field('Tagi', wrap, `Np. temat, poziom, klasa. Do ${MAX_TAGS} tagów; wielkość liter nie ma znaczenia. Po tagach możesz filtrować pytania w edytorze i przy składaniu zestawów.`);
}


const field = (label, el, help) => h('div', { class: 'field' }, h('label', {}, label), el, help ? h('div', { class: 'hint' }, help) : '');
const textInput = (value, onInput, placeholder = '') => {
  const i = h('input', { type: 'text', placeholder }); i.value = value ?? '';
  i.addEventListener('input', () => onInput(i.value)); return i;
};
const textArea = (value, onInput, rows = 3, placeholder = '') => {
  const t = h('textarea', { rows: String(rows), placeholder }); t.value = value ?? '';
  t.addEventListener('input', () => onInput(t.value));
  t.addEventListener('keydown', ev => {       // Ctrl+B / Cmd+B: pogrubienie zaznaczonego tekstu
    if (!((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'b')) return;
    ev.preventDefault();
    const { selectionStart: a, selectionEnd: b, value } = t, sel = value.slice(a, b);
    const wrapped = sel.startsWith('**') && sel.endsWith('**') && sel.length >= 4;
    const ins = wrapped ? sel.slice(2, -2) : '**' + sel + '**';
    t.setRangeText(ins, a, b, 'select');
    if (!sel && !wrapped) t.setSelectionRange(a + 2, a + 2);
    t.dispatchEvent(new Event('input'));
  });
  return t;
};
const plainTitle = q => (String(q.prompt || '').replace(/\$+/g, '').replace(/\*\*/g, '').replace(/\s+/g, ' ').trim() || '(pusta treść)');

// Stan zapisu pokazywany w pasku narzędzi edytora (ok / saving / error).
let saveState = { kind: 'idle', text: '' };
function setSaveStatus(kind, text) {
  saveState = { kind, text };
  if (!statusEl) return;
  statusEl.className = 'status' + (kind === 'error' ? ' bad' : '');
  statusEl.replaceChildren(text);
  if (kind === 'error' && MODE === 'cloud')
    statusEl.append(' ', h('button', { class: 'secondary small', type: 'button', onclick: () => flushSync() }, 'Ponów'));
}

function commit() {
  if (MODE === 'cloud') {
    // w bazie identyfikatory muszą być w formacie UUID (np. po imporcie starego pliku)
    questions.forEach(q => { if (!UUID_RE.test(q.id)) { const old = q.id; q.id = uuidv4(); if (sel === old) sel = q.id; } });
    scheduleSync();
  } else {
    const saved = saveQuestions();
    setSaveStatus(saved ? 'ok' : 'error', saved
      ? 'Zapisano w przeglądarce (' + new Date().toLocaleTimeString('pl-PL') + ')'
      : 'Uwaga: zapis w przeglądarce niedostępny – korzystaj z eksportu do pliku.');
  }
  dirty = true;
  refreshQuiz();
  renderList();
}

function renderList() {
  if (!listEl) return;
  listEl.replaceChildren();
  refreshFilterBar();
  const filtering = !!(EF.tags.length || EF.text);
  if (!questions.length) listEl.append(h('p', { class: 'hint' }, 'Brak pytań. Dodaj pierwsze przyciskiem powyżej.'));
  if (questions.length && !questions.some(matchesFilter)) listEl.append(h('p', { class: 'hint' }, 'Żadne pytanie nie pasuje do filtra.'));
  questions.forEach((q, idx) => {
    if (!matchesFilter(q)) return;
    const bad = problems(q).length > 0;
    const move = (d) => (ev) => {
      ev.stopPropagation();
      const j = idx + d; if (j < 0 || j >= questions.length) return;
      [questions[idx], questions[j]] = [questions[j], questions[idx]]; commit();
    };
    const up = h('button', { class: 'secondary small', type: 'button', title: 'W górę', onclick: move(-1) }, '↑');
    const down = h('button', { class: 'secondary small', type: 'button', title: 'W dół', onclick: move(1) }, '↓');
    up.disabled = filtering || idx === 0; down.disabled = filtering || idx === questions.length - 1;
    const del = h('button', { class: 'secondary small danger', type: 'button', title: 'Usuń pytanie', onclick: ev => {
      ev.stopPropagation();
      if (!confirm(MODE === 'cloud' ? 'Usunąć to pytanie z bazy? Zniknie też ze wszystkich zestawów (zapisane wyniki uczniów zostaną).' : 'Usunąć to pytanie?')) return;
      questions.splice(idx, 1);
      if (sel === q.id) sel = questions[Math.min(idx, questions.length - 1)]?.id ?? null;
      commit(); renderForm();
    } }, '✕');
    listEl.append(h('div', { class: 'qrow' + (q.id === sel ? ' sel' : ''), onclick: () => { sel = q.id; renderList(); renderForm(); } },
      h('div', { class: 'warn', title: bad ? 'Pytanie wymaga poprawek' : '' }, bad ? '⚠' : ''),
      h('div', { class: 't' }, h('b', {}, `${idx + 1}. ${plainTitle(q)}`), h('span', {}, TYPE_LABEL[q.type]),
        (q.tags || []).length ? h('div', { class: 'tg' }, q.tags.map(t => h('span', { class: 'chip ro' }, t))) : ''),
      up, down, del));
  });
}

function previewBox(text) { const p = h('div', { class: 'preview' }); setRich(p, text); return p; }

function optionsEditor(q) {
  const wrap = h('div');
  const draw = () => {
    wrap.replaceChildren();
    q.options.forEach((o, i) => {
      const mark = h('input', { type: q.type === 'single' ? 'radio' : 'checkbox', name: 'correct', title: 'Poprawna odpowiedź' });
      mark.checked = q.type === 'single' ? q.correct === i : q.correct.includes(i);
      mark.addEventListener('change', () => {
        if (q.type === 'single') q.correct = i;
        else q.correct = mark.checked ? [...q.correct, i].sort((a, b) => a - b) : q.correct.filter(c => c !== i);
        commit(); refreshProblems();
      });
      const inp = textInput(o, v => { q.options[i] = v; commit(); refreshProblems(); }, `Odpowiedź ${i + 1} (wzory w $…$)`);
      const del = h('button', { class: 'secondary small danger', type: 'button', title: 'Usuń odpowiedź', onclick: () => {
        if (removeOption(q, i)) { commit(); draw(); refreshProblems(); }

      del.disabled = q.options.length <= 2;
      wrap.append(h('div', { class: 'optrow' }, mark, inp, del));

function mathPreviewLines(text) {
  const box = h('div', { class: 'preview' });
  nonEmpty(text.split('\n')).forEach(line => {
    const row = h('div');
    if (window.katex) { try { window.katex.render(line, row, { throwOnError: false }); } catch { row.textContent = line; } }
    else row.textContent = line;
    box.append(row);
  });
  return box;
}

function ggbEditor(q) {
  const wrap = h('div');
  const refs = {};
  wrap.append(field('Polecenia GeoGebry (jedno w linii)',
    textArea(q.setup.join('\n'), v => { q.setup = v.split('\n'); commit(); refreshProblems(); }, 6, 'f(x)=2x+1\nA=(3,-2)'),
    'Polecenia wykonują się w podanej kolejności po załadowaniu apletu, np. definicja funkcji i punkt początkowy.'));
  const num = (key, label) => {
    const i = h('input', { type: 'number', step: 'any' });
    i.value = Number.isFinite(q.target[key]) ? q.target[key] : '';
    i.addEventListener('input', () => { q.target[key] = i.value === '' ? NaN : Number(i.value); commit(); refreshProblems(); });
    refs[key] = i; return field(label, i);
  };
  wrap.append(field('Sprawdzany obiekt (nazwa punktu)',
    textInput(q.target.object, v => { q.target.object = v.trim(); commit(); refreshProblems(); }, 'np. A')));
  wrap.append(h('div', { class: 'numrow' }, num('x', 'Poprawne x'), num('y', 'Poprawne y'), num('tol', 'Tolerancja')));

  const holder = h('div', { class: 'ggb' });
  let api = null;
  const show = h('button', { class: 'secondary', type: 'button', onclick: () => {
    holder.replaceChildren(); api = null;
    const inner = h('div'); holder.append(inner);
    mountGGB(inner, clean(q).setup, 340, a => { api = a; });

      q.target.x = +api.getXcoord(o).toFixed(2); q.target.y = +api.getYcoord(o).toFixed(2);
      refs.x.value = q.target.x; refs.y.value = q.target.y; commit(); refreshProblems();
    } catch { alert('Nie znaleziono obiektu „' + o + '” w aplecie.'); }
  } }, 'Ustaw poprawne x, y z bieżącego położenia punktu');
  wrap.append(h('div', { class: 'actions' }, show, grab), holder);
  return wrap;
}

// Edytor mini-pytania jednokrotnego wyboru (używany wewnątrz podpowiedzi).

      const formHelp = h('div', { class: 'hint' }), formSel = h('select');

        'Wielkość liter i nadmiarowe spacje nie mają znaczenia, a przecinek dziesiętny jest traktowany jak kropka. Wpisz wszystkie warianty, które uznajesz za poprawne.'));
      return;

      mark.checked = mini.correct === i;

    wrap.append(h('div', { class: 'hint' }, 'Zaznacz kółkiem jedną poprawną odpowiedź.'));

// Edytory pól zależnych od typu – wspólne dla pytań i dla części zadania z kilkoma poleceniami.

        textArea(q.expected.join('\n'), v => {
          q.expected = v.split('\n'); const n = mathPreviewLines(v); pv.replaceWith(n); pv = n; commit(); refreshProblems();
        }, 3, '4x'),

    wrap.append(h('div', { class: 'phead', style: 'margin-top:10px' }, addSel, add));

function exportJSON() {

  const a = h('a', { href: URL.createObjectURL(blob), download: 'pytania.json' });
  document.body.append(a); a.click(); a.remove();

}

function importJSON(file) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const data = JSON.parse(fr.result);
      const arr = Array.isArray(data) ? data : data.questions;
      if (!Array.isArray(arr)) throw new Error('Brak listy pytań.');
      // w bazie import tylko DODAJE pytania (nie kasuje istniejących i nie rusza zestawów)
      const used = new Set(MODE === 'cloud' ? questions.map(q => q.id) : []);
      const imported = arr.map(q => normalizeImported(q, used)).filter(Boolean);
      if (!imported.length) throw new Error('Plik nie zawiera poprawnych pytań.');
      if (MODE === 'cloud') {
        if (!confirm(`Dodać ${imported.length} pytań z pliku do bazy?`)) return;
        questions.push(...imported); sel = imported[0].id;
      } else {
        if (!confirm(`Zastąpić obecne pytania (${questions.length}) zaimportowanymi (${imported.length})?`)) return;
        questions = imported; sel = questions[0].id;
      }
      commit(); renderForm();
    } catch (e) { alert('Nie udało się zaimportować pliku: ' + e.message); }
  };
  fr.readAsText(file);
}

/* ==========================================================================
   CHMURA (Supabase): zapis pytań w bazie
   ========================================================================== */
const rowOf = (q, i) => { const { id, type, ...content } = q; return { id, type, position: i, content }; };
const synced = new Map();            // id pytania -> JSON ostatnio zapisanego wiersza
let syncTimer = null, syncActive = 0, syncPromise = Promise.resolve();

async function loadCloudQuestions() {
  const { data, error } = await sb.from('questions').select('id,type,position,content,created_at')
    .order('position', { ascending: true }).order('created_at', { ascending: true });
  if (error) throw error;
  const used = new Set();
  questions = (data || []).map(r => normalizeImported({ ...(r.content || {}), id: r.id, type: r.type }, used)).filter(Boolean);
  synced.clear();
  questions.forEach((q, i) => synced.set(q.id, JSON.stringify(rowOf(q, i))));
}

// Zapis z opóźnieniem: zmiany z kilku sekund trafiają do bazy jednym żądaniem.
function scheduleSync() {
  if (MODE !== 'cloud') return;
  clearTimeout(syncTimer);
  setSaveStatus('saving', 'Zapisywanie…');
  syncTimer = setTimeout(() => { syncTimer = null; runSync(); }, 700);
}
function runSync() { syncPromise = syncPromise.then(doSync); return syncPromise; }
function flushSync() { if (syncTimer) { clearTimeout(syncTimer); syncTimer = null; } return runSync(); }

// Porównuje aktualne pytania z tym, co ostatnio zapisano: wysyła zmienione, usuwa skasowane.
async function doSync() {
  if (MODE !== 'cloud' || !sb) return true;
  syncActive++;
  try {
    const ids = questions.map(q => q.id);
    const snaps = questions.map((q, i) => JSON.stringify(rowOf(q, i)));   // migawka w chwili zapisu
    const changed = ids.map((id, i) => [id, snaps[i]]).filter(([id, json]) => synced.get(id) !== json);
    const present = new Set(ids);
    const removed = [...synced.keys()].filter(id => !present.has(id));
    if (changed.length) {
      const { error } = await sb.from('questions').upsert(changed.map(([, json]) => JSON.parse(json)), { onConflict: 'id' });
      if (error) throw error;
      changed.forEach(([id, json]) => synced.set(id, json));
    }
    if (removed.length) {
      const { error } = await sb.from('questions').delete().in('id', removed);
      if (error) throw error;
      removed.forEach(id => synced.delete(id));
    }
    if (!syncTimer) setSaveStatus('ok', 'Zapisano w bazie (' + new Date().toLocaleTimeString('pl-PL') + ')');
    return true;
  } catch (e) {
    console.warn('Zapis do bazy nie powiódł się:', e);
    setSaveStatus('error', 'Nie udało się zapisać w bazie: ' + friendlyError(e));
    return false;
  } finally { syncActive--; }
}
window.addEventListener('beforeunload', ev => { if (syncTimer || syncActive) { ev.preventDefault(); ev.returnValue = ''; } });

  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Brak połączenia z serwerem. Sprawdź internet i spróbuj ponownie.';
  if (/row-level security|permission denied/i.test(m) || code === '42501') return 'Brak uprawnień do tej operacji.';
  return m;
}
