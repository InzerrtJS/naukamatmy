/* ==========================================================================
   UCZEŃ: lista zestawów i rozwiązywanie z zapisem wyników
   ========================================================================== */
function studentCtx(quiz, attemptId) {
  const inflight = [], pending = [];
  let moreChain = Promise.resolve(true);
  const ctx = {
    kind: 'student', quiz, attemptId, inflight, pending, resultPromise: null, more: new Map(),
    onAnswer(p) {
      const row = {
        attempt_id: attemptId, question_id: p.q.id, question_type: p.q.type, question_prompt: p.q.prompt,
        answer: p.value === undefined ? null : p.value, status: p.status,
        hints_used: p.hintsUsed, hints_total: p.q.hints.length, hint_minis: p.minis, time_spent_s: p.spent,
        wants_more: !!ctx.more.get(p.q.id)
      };
      inflight.push((async () => {
        try {
          const { error } = await sb.from('answers').insert(row);
          if (error) throw error;
        } catch (e) { console.warn('Zapis odpowiedzi nie powiódł się:', e); pending.push(row); }
      })());
    },
    // „Chcę więcej takich zadań”: zapis po zapisaniu odpowiedzi (kolejne zmiany idą jedna po drugiej)
    onWantMore(q, on) {
      ctx.more.set(q.id, on);
      const queued = pending.find(r => r.question_id === q.id);
      if (queued) queued.wants_more = on;                     // odpowiedź jeszcze nie zapisana – flaga pojedzie razem z nią
      moreChain = moreChain.then(async () => {
        await Promise.all(inflight);
        if (pending.some(r => r.question_id === q.id)) return true;
        const { error } = await sb.from('answers').update({ wants_more: on }).eq('attempt_id', attemptId).eq('question_id', q.id);
        if (error) { console.warn('Zapis prośby o więcej zadań nie powiódł się:', error); return false; }
        return true;
      }).catch(e => { console.warn(e); return false; });
      return moreChain;
    },
    // czeka na zapisy w toku i ponawia nieudane; true, gdy wszystko jest już w bazie
    async flushAnswers() {
      await Promise.all(inflight); await moreChain;
      for (let tries = 0; tries < 2 && pending.length; tries++) {
        const rows = pending.splice(0);
        try {
          const { error } = await sb.from('answers').insert(rows);
          if (error) throw error;
        } catch (e) { pending.push(...rows); }
      }
      return !pending.length;
    },
    async onPause() {
      if (!(await ctx.flushAnswers()) && !confirm('Nie wszystkie odpowiedzi udało się zapisać (sprawdź połączenie). Jeśli wyjdziesz teraz, część odpowiedzi zostanie utracona. Wyjść mimo to?')) return;
      activateTab('home');
    },
    onFinish() {
      if (ctx.resultPromise) return ctx.resultPromise;
      ctx.resultPromise = (async () => {
        await ctx.flushAnswers();
        if (pending.length) return { ok: false, error: 'nie wszystkie odpowiedzi udało się zapisać (sprawdź połączenie).' };
        try {
          const { error } = await sb.from('attempts').update({ finished_at: new Date().toISOString() }).eq('id', attemptId);
          if (error) throw error;
          return { ok: true };
        } catch (e) { return { ok: false, error: friendlyError(e) }; }
      })();
      return ctx.resultPromise;
    },
    onExit() { activateTab('home'); }
  };
  return ctx;
}

async function startStudentQuiz(quiz, resumeId = null) {
  quizEl.replaceChildren(loadingBox());
  activateTab('quiz');
  try {
    const qq = await sb.from('quiz_questions').select('question_id,position').eq('quiz_id', quiz.id).order('position', { ascending: true });
    if (qq.error) throw qq.error;
    const ids = qq.data.map(r => r.question_id);
    let list = [];
    if (ids.length) {
      const qs = await sb.from('questions').select('id,type,content').in('id', ids);
      if (qs.error) throw qs.error;
      const byId = new Map(qs.data.map(r => [r.id, r]));
      const used = new Set();
      list = ids.map(id => byId.get(id)).filter(Boolean)
        .map(r => normalizeImported({ ...(r.content || {}), id: r.id, type: r.type }, used)).filter(Boolean)
        .filter(q => !problems(q).length).map(clean);
    }
    if (!list.length) {
      QCTX = { kind: 'student', onExit: () => activateTab('home') }; QUIZ = []; resetSession(); showQuestion();
      quizEl.append(h('button', { class: 'secondary', type: 'button', onclick: () => activateTab('home') }, 'Wróć do listy zestawów'));
      return;
    }
    let attemptId = resumeId, done = new Map();
    if (resumeId) {
      const old = await sb.from('answers').select('question_id,status,hints_used,hint_minis').eq('attempt_id', resumeId);
      if (old.error) throw old.error;
      old.data.forEach(a => { if (a.question_id) done.set(a.question_id, a); });
    } else {
      const att = await sb.from('attempts').insert({ quiz_id: quiz.id }).select('id').single();
      if (att.error) throw att.error;
      attemptId = att.data.id;
    }
    QCTX = studentCtx(quiz, attemptId);
    QCTX.done = done;
    QUIZ = list; resetSession();
    // wznowienie: odtwórz wyniki już rozwiązanych pytań, żeby podsumowanie dotyczyło całego podejścia
    QUIZ.forEach((q, i) => {
      const a = done.get(q.id); if (!a) return;
      S.res[i] = a.status; S.hints[i] = a.hints_used || 0;
      (Array.isArray(a.hint_minis) ? a.hint_minis : []).forEach(m => { (S.mini[i] ??= [])[m.hint - 1] = { attempts: m.attempts, solved: !!m.solved }; });
    });
    showQuestion();
  } catch (e) {
    quizEl.replaceChildren(errBox(e), h('button', { class: 'secondary', type: 'button', onclick: () => activateTab('home') }, 'Wróć do listy zestawów'));
  }
}

async function openMyAttempt(r, box) {
  box.replaceChildren(h('div', { class: 'card detail' }, loadingBox()));
  const a = await sb.from('answers').select('*').eq('attempt_id', r.attempt_id).order('created_at', { ascending: true });
  if (a.error) { box.replaceChildren(errBox(a.error)); return; }
  const STATUS = { correct: 'poprawnie', wrong: 'błędnie', manual: 'czeka na ocenę' };
  const items = a.data.map((x, i) => {
    const reviewed = x.status === 'manual' && x.reviewed_at;
    return h('div', { class: 'card' },
      h('div', { class: 'meta' }, `Pytanie ${i + 1} · `, h('span', { class: 'badge ' + (x.status === 'correct' || reviewed ? 'on' : x.status === 'manual' ? 'warn' : '') }, reviewed ? 'ocenione przez nauczyciela' : STATUS[x.status] || x.status)),
      h('p', {}, plainTitle({ prompt: x.question_prompt })),
      h('div', { class: 'hint' }, 'Twoja odpowiedź:'), h('div', { style: 'white-space:pre-wrap;margin-bottom:8px' }, fmtAnswer(x)),
      x.points != null ? h('div', {}, h('b', {}, 'Punkty: '), String(x.points)) : '',
      x.teacher_comment ? h('div', { class: 'note' }, h('b', {}, 'Komentarz nauczyciela: '), x.teacher_comment) : '');
  });
  box.replaceChildren(h('h3', {}, r.quiz_title + ' – ' + fmtDT(r.started_at)), ...(items.length ? items : [h('p', { class: 'hint' }, 'Brak zapisanych odpowiedzi.')]));
}

async function showHome() {
  homeEl.replaceChildren(loadingBox());
  try {
    const [qz, rs, qc] = await Promise.all([
      sb.from('quizzes').select('id,title,description,mode').order('created_at', { ascending: false }),
      sb.from('results_overview').select('*').order('started_at', { ascending: false }),
      sb.from('quiz_questions').select('quiz_id,question_id')
    ]);
    if (qz.error) throw qz.error;
    if (rs.error) throw rs.error;
    if (qc.error) throw qc.error;
    const out = [h('h2', { style: 'margin-top:0' }, `Cześć${ME.full_name ? ', ' + ME.full_name : ''}!`)];
    if (!qz.data.length) out.push(h('div', { class: 'note' }, 'Nie masz jeszcze przypisanych zestawów. Poproś nauczyciela o udostępnienie zestawu.'));
    qz.data.forEach(z => {
      const done = rs.data.filter(r => r.quiz_id === z.id && r.finished_at);
      const last = done[0];
      const newest = rs.data.find(r => r.quiz_id === z.id);                       // najnowsze podejście (lista jest posortowana malejąco)
      const open = newest && !newest.finished_at ? newest : null;                  // niedokończone = można kontynuować
      const total = qc.data.filter(r => r.quiz_id === z.id).length;
      out.push(h('div', { class: 'card setcard' },
        h('h3', {}, z.title),
        z.description ? h('p', { class: 'hint' }, z.description) : '',
        open ? h('div', { class: 'note' }, `Masz rozpoczęte podejście (${fmtDT(open.started_at)}): odpowiedzi ${toNum(open.answered)} z ${total}. Możesz je dokończyć.`) : '',
        h('div', { class: 'meta' }, last
          ? `Ukończono: ${done.length}× · ostatni wynik: ${last.correct} z ${toNum(last.correct) + toNum(last.wrong)}` + (toNum(last.manual) ? ` (+${last.manual} do oceny)` : '')
          : 'Jeszcze nie rozwiązywany'),
        h('div', { class: 'rowbtns' }, open
          ? [h('button', { class: 'primary', type: 'button', onclick: () => startStudentQuiz(z, open.attempt_id) }, 'Kontynuuj'),
             h('button', { class: 'secondary', type: 'button', onclick: () => { if (confirm('Rozpocząć nowe podejście od początku? Rozpoczęte podejście zostanie w wynikach jako niedokończone.')) startStudentQuiz(z); } }, 'Zacznij od nowa')]
          : h('button', { class: 'primary', type: 'button', onclick: () => startStudentQuiz(z) }, done.length ? 'Rozwiąż ponownie' : 'Rozpocznij'))));
    });
    if (rs.data.length) {
      out.push(h('h3', {}, 'Moje wyniki'));
      const detail = h('div');
      out.push(h('p', { class: 'hint' }, 'Kliknij wynik, aby zobaczyć swoje odpowiedzi, oceny i komentarze nauczyciela.'));
      out.push(table(['Zestaw', 'Rozpoczęto', 'Status', 'Poprawne', 'Do oceny', 'Podpowiedzi'], rs.data.map(r => h('tr', { class: 'click', onclick: () => openMyAttempt(r, detail) },
        h('td', {}, r.quiz_title), h('td', {}, fmtDT(r.started_at)), h('td', {}, r.finished_at ? 'ukończony' : 'w toku'),
        h('td', {}, `${toNum(r.correct)} z ${toNum(r.correct) + toNum(r.wrong)}`), h('td', {}, String(toNum(r.manual))),
        h('td', {}, `${toNum(r.hints_used)} z ${toNum(r.hints_available)}`)))));
      out.push(detail);
    }
    homeEl.replaceChildren(...out);
  } catch (e) { homeEl.replaceChildren(errBox(e)); }
}

/* ==========================================================================
   NAUCZYCIEL: zestawy pytań i przypisywanie uczniom
   ========================================================================== */
const SETS = { list: [], qq: [], as: [], students: [], cur: null, orig: null, cls: '', flash: '', tf: { tags: [], mode: 'all' } };

async function loadSetsData() {
  const [qz, qq, as, st] = await Promise.all([
    sb.from('quizzes').select('id,title,description,mode,published,created_at').order('created_at', { ascending: false }),
    sb.from('quiz_questions').select('quiz_id,question_id,position'),
    sb.from('assignments').select('quiz_id,student_id'),
    sb.from('profiles').select('id,full_name,login,class_name,active').eq('role', 'student')
      .order('class_name', { ascending: true }).order('full_name', { ascending: true })
  ]);
  for (const r of [qz, qq, as, st]) if (r.error) throw r.error;
  Object.assign(SETS, { list: qz.data, qq: qq.data, as: as.data, students: st.data });
  if (SETS.cur && SETS.cur.id && !SETS.list.some(z => z.id === SETS.cur.id)) SETS.cur = null;
}

async function showSets() {
  setsEl.replaceChildren(loadingBox());
  try {
    // pytania muszą być już w bazie, zanim trafią do zestawu (klucz obcy)
    if (!(await flushSync())) throw new Error('Najpierw trzeba zapisać pytania w bazie – zapis się nie powiódł (zobacz zakładkę „Pytania”).');
    await loadSetsData();
  } catch (e) { setsEl.replaceChildren(errBox(e)); return; }
  renderSets();
}

function openSet(id) {
  const z = id ? SETS.list.find(x => x.id === id) : null;
  SETS.cur = z
    ? { id: z.id, title: z.title, description: z.description || '', mode: z.mode, published: z.published,
        qids: SETS.qq.filter(r => r.quiz_id === id).sort((a, b) => a.position - b.position).map(r => r.question_id),
        sids: new Set(SETS.as.filter(r => r.quiz_id === id).map(r => r.student_id)) }
    : { id: null, title: '', description: '', mode: 'practice', published: false, qids: [], sids: new Set() };
  SETS.orig = { qids: [...SETS.cur.qids], sids: new Set(SETS.cur.sids) };
  renderSets();
}

function renderSets() {
  const list = h('div', { class: 'qlist' });
  list.append(h('button', { class: 'primary', type: 'button', onclick: () => openSet(null) }, '+ Nowy zestaw'));
  if (!SETS.list.length) list.append(h('p', { class: 'hint' }, 'Brak zestawów. Utwórz pierwszy.'));
  SETS.list.forEach(z => {
    const nq = SETS.qq.filter(r => r.quiz_id === z.id).length, ns = SETS.as.filter(r => r.quiz_id === z.id).length;
    list.append(h('div', { class: 'qrow' + (SETS.cur && SETS.cur.id === z.id ? ' sel' : ''), onclick: () => openSet(z.id) },
      h('div', { class: 't' }, h('b', {}, z.title || '(bez nazwy)'), h('span', {}, `${nq} pytań · ${ns} uczniów`)),
      h('span', { class: 'badge ' + (z.published ? 'on' : '') }, z.published ? 'opublikowany' : 'szkic')));
  });
  const form = h('div');
  if (SETS.cur) form.append(setForm());
  else form.append(h('div', { class: 'card' }, h('p', { class: 'hint' }, 'Wybierz zestaw z listy albo utwórz nowy.')));
  setsEl.replaceChildren(h('div', { class: 'editor' }, list, form));
}

// Treść pytania ze skompilowanymi wzorami, skrócona do kilku linii (do list wyboru).
const richTitle = q => rich('span', String(q.prompt || '').replace(/\s*\n\s*/g, ' ').trim() || '(pusta treść)', 'ptxt');

function questionPicker() {
  const c = SETS.cur, wrap = h('div'), box = h('div');
  const byId = new Map(questions.map(q => [q.id, q]));
  const draw = () => {
    box.replaceChildren();
    c.qids = c.qids.filter(id => byId.has(id));
    const chosen = h('div', { class: 'pick' });
    if (!c.qids.length) chosen.append(h('p', { class: 'hint' }, 'Nie wybrano jeszcze pytań. Dodaj je z listy poniżej.'));
    c.qids.forEach((id, i) => {
      const q = byId.get(id);
      const mv = d => () => { const j = i + d; if (j < 0 || j >= c.qids.length) return; [c.qids[i], c.qids[j]] = [c.qids[j], c.qids[i]]; draw(); };
      const up = h('button', { class: 'secondary small', type: 'button', title: 'Wcześniej', onclick: mv(-1) }, '↑');
      const dn = h('button', { class: 'secondary small', type: 'button', title: 'Później', onclick: mv(1) }, '↓');
      up.disabled = i === 0; dn.disabled = i === c.qids.length - 1;
      chosen.append(h('div', { class: 'pickrow' }, h('span', {}, `${i + 1}.`),
        h('span', { class: 't' }, richTitle(q), problems(q).length ? ' ⚠' : ''), up, dn,
        h('button', { class: 'secondary small danger', type: 'button', title: 'Usuń z zestawu', onclick: () => { c.qids.splice(i, 1); draw(); } }, '✕')));
    });
    const avail = h('div', { class: 'pick' });
    const rest = questions.filter(q => !c.qids.includes(q.id) && matchesTags(q, SETS.tf.tags, SETS.tf.mode));
    if (!rest.length) avail.append(h('p', { class: 'hint' }, !questions.length ? 'Brak pytań – dodaj je w zakładce „Pytania”.' : SETS.tf.tags.length ? 'Brak pytań pasujących do filtra poza już wybranymi.' : 'Wszystkie pytania są już w zestawie.'));
    addAll.disabled = !rest.length; addAll.textContent = rest.length ? `+ dodaj wszystkie widoczne (${rest.length})` : '+ dodaj wszystkie widoczne';
    addAll.onclick = () => { rest.forEach(q => c.qids.push(q.id)); draw(); };
    rest.forEach(q => avail.append(h('div', { class: 'pickrow' },
      h('span', { class: 't' }, richTitle(q), problems(q).length ? ' ⚠' : '', h('div', { class: 'hint' }, TYPE_LABEL[q.type]),
        (q.tags || []).map(t => h('span', { class: 'chip ro', style: 'margin-left:4px' }, t))),
      h('button', { class: 'secondary small', type: 'button', onclick: () => { c.qids.push(q.id); draw(); } }, '+ dodaj'))));
    box.append(chosen, h('div', { class: 'filters' }, h('span', { class: 'hint' }, 'Dostępne pytania:')), tagBox, h('div', { class: 'filters' }, addAll), avail);
  };
  const tagBox = tagFilterBox(SETS.tf, () => draw());
  const addAll = h('button', { class: 'secondary small', type: 'button' });
  wrap.append(box);
  draw();
  return wrap;
}

function studentPicker() {
  const c = SETS.cur, wrap = h('div');
  const classes = [...new Set(SETS.students.map(s => s.class_name || '').filter(Boolean))].sort((a, b) => a.localeCompare(b, 'pl'));
  const clsSel = h('select');
  clsSel.append(h('option', { value: '' }, 'Wszystkie klasy'));
  classes.forEach(k => clsSel.append(h('option', { value: k }, k)));
  clsSel.value = SETS.cls;
  const box = h('div', { class: 'pick' });
  const cnt = h('span', { class: 'hint' });
  const visible = () => SETS.students.filter(s => !SETS.cls || s.class_name === SETS.cls);
  const count = () => { cnt.textContent = `Wybrano: ${c.sids.size}`; };
  const draw = () => {
    box.replaceChildren();
    if (!SETS.students.length) box.append(h('p', { class: 'hint' }, 'Brak uczniów. Dodaj konta uczniów (zakładka „Uczniowie”) – pojawią się tu automatycznie.'));
    visible().forEach(s => {
      const cb = h('input', { type: 'checkbox' }); cb.checked = c.sids.has(s.id);
      cb.onchange = () => { if (cb.checked) c.sids.add(s.id); else c.sids.delete(s.id); count(); };
      box.append(h('label', { class: 'pickrow' }, cb, h('span', { class: 't' },
        s.full_name || s.login || '(bez nazwy)',
        s.class_name ? h('span', { class: 'hint' }, ' · ' + s.class_name) : '',
        s.active ? '' : h('span', { class: 'badge warn' }, 'nieaktywny'))));
    });
  };
  clsSel.onchange = () => { SETS.cls = clsSel.value; draw(); };
  const all = h('button', { class: 'secondary small', type: 'button', onclick: () => { visible().forEach(s => c.sids.add(s.id)); draw(); count(); } }, 'Zaznacz widocznych');
  const none = h('button', { class: 'secondary small', type: 'button', onclick: () => { visible().forEach(s => c.sids.delete(s.id)); draw(); count(); } }, 'Odznacz widocznych');
  wrap.append(h('div', { class: 'filters' }, clsSel, all, none, cnt), box);
  draw(); count();
  return wrap;
}

async function saveSet(c, orig) {
  const base = { title: c.title.trim(), description: c.description.trim(), mode: c.mode, published: !!c.published };
  let id = c.id;
  if (!id) {
    const r = await sb.from('quizzes').insert(base).select('id').single();
    if (r.error) throw r.error;
    id = r.data.id;
  } else {
    const r = await sb.from('quizzes').update(base).eq('id', id);
    if (r.error) throw r.error;
  }
  const removedQ = orig.qids.filter(x => !c.qids.includes(x));
  if (removedQ.length) {
    const r = await sb.from('quiz_questions').delete().eq('quiz_id', id).in('question_id', removedQ);
    if (r.error) throw r.error;
  }
  if (c.qids.length) {
    const r = await sb.from('quiz_questions')
      .upsert(c.qids.map((question_id, position) => ({ quiz_id: id, question_id, position })), { onConflict: 'quiz_id,question_id' });
    if (r.error) throw r.error;
  }
  const addedS = [...c.sids].filter(x => !orig.sids.has(x)), removedS = [...orig.sids].filter(x => !c.sids.has(x));
  if (removedS.length) {
    const r = await sb.from('assignments').delete().eq('quiz_id', id).in('student_id', removedS);
    if (r.error) throw r.error;
  }
  if (addedS.length) {
    const r = await sb.from('assignments').insert(addedS.map(student_id => ({ quiz_id: id, student_id })));
    if (r.error) throw r.error;
  }
  return id;
}

function setForm() {
  const c = SETS.cur;
  const msg = h('div', { class: 'note', hidden: '' });
  const say = (text, kind = '') => { msg.hidden = !text; msg.className = 'note ' + kind; msg.textContent = text || ''; };
  const card = h('div', { class: 'card' }, msg);
  if (SETS.flash) { say(SETS.flash, 'good'); SETS.flash = ''; }
  card.append(field('Nazwa zestawu', textInput(c.title, v => { c.title = v; }, 'np. Funkcja kwadratowa – powtórka')));
  card.append(field('Opis (opcjonalnie)', textArea(c.description, v => { c.description = v; }, 2)));
  const modeSel = h('select');
  [['practice', 'Ćwiczenie'], ['test', 'Sprawdzian']].forEach(([k, v]) => modeSel.append(h('option', { value: k }, v)));
  modeSel.value = c.mode; modeSel.onchange = () => { c.mode = modeSel.value; };
  card.append(field('Rodzaj', modeSel, 'Na razie oba rodzaje działają tak samo: odpowiedzi ocenia przeglądarka ucznia.'));
  const pub = h('input', { type: 'checkbox' }); pub.checked = !!c.published; pub.onchange = () => { c.published = pub.checked; };
  card.append(h('label', { class: 'opt' }, pub, h('span', {}, 'Opublikowany – przypisani uczniowie widzą ten zestaw')));
  card.append(field('Pytania w zestawie (w kolejności zadawania)', questionPicker()));
  card.append(field('Uczniowie, którzy dostają ten zestaw', studentPicker()));

  const save = h('button', { class: 'primary', type: 'button' }, 'Zapisz zestaw');
  save.onclick = async () => {
    if (!c.title.trim()) { say('Podaj nazwę zestawu.', 'bad'); return; }
    if (c.published && !c.qids.length) { say('Opublikowany zestaw musi mieć co najmniej jedno pytanie.', 'bad'); return; }
    save.disabled = true; say('Zapisywanie…');
    try {
      const id = await saveSet(c, SETS.orig);
      await loadSetsData();
      SETS.flash = 'Zestaw zapisany.';
      openSet(id);
    } catch (e) { save.disabled = false; say('Nie udało się zapisać: ' + friendlyError(e), 'bad'); }
  };
  const btns = h('div', { class: 'rowbtns' }, save);
  if (c.id) btns.append(h('button', { class: 'secondary danger', type: 'button', onclick: async () => {
    try {
      const r = await sb.from('results_overview').select('attempt_id').eq('quiz_id', c.id);
      const n = r.data ? r.data.length : 0;
      if (!confirm(n ? `Ten zestaw ma ${n} zapisanych podejść uczniów. Usunięcie zestawu usunie je razem z odpowiedziami. Usunąć na pewno?` : 'Usunąć ten zestaw?')) return;
      const d = await sb.from('quizzes').delete().eq('id', c.id);
      if (d.error) throw d.error;
      SETS.cur = null; await loadSetsData(); renderSets();
    } catch (e) { say('Nie udało się usunąć: ' + friendlyError(e), 'bad'); }
  } }, 'Usuń zestaw'));
  card.append(btns);
  return card;
}

/* ==========================================================================
   NAUCZYCIEL: wyniki uczniów i użyte podpowiedzi
   ========================================================================== */
const RES = { rows: [], f: { quiz: '', cls: '', q: '', hints: false, more: false }, open: null, answers: null };

async function showResults() {
  resultsEl.replaceChildren(loadingBox());
  try {
    const r = await sb.from('results_overview').select('*').order('started_at', { ascending: false }).limit(500);
    if (r.error) throw r.error;
    RES.rows = r.data; RES.open = null; RES.answers = null;
  } catch (e) { resultsEl.replaceChildren(errBox(e)); return; }
  renderResults();
}

function fmtAnswer(a) {
  const v = a.answer;
  if (v === null || v === undefined || v === '') return '—';
  switch (a.question_type) {
    case 'truefalse': return v === true ? 'Prawda' : v === false ? 'Fałsz' : '—';
    case 'group': {
      const ST = { correct: '✓', wrong: '✗', manual: '(do oceny)' };
      return h('div', {}, (v.parts || []).map((x, i) => h('div', { style: 'margin-bottom:4px' },
        h('b', {}, partLetter(i) + ' '), `${x.prompt}: `, h('span', {}, x.answer || '—'), ` ${ST[x.status] || ''}`)));
    }
    case 'single': return `opcja nr ${Number(v) + 1}`;
    case 'multi': return Array.isArray(v) && v.length ? 'opcje nr ' + v.map(i => i + 1).join(', ') : '—';
    case 'geogebra': return typeof v === 'object' ? `punkt (${(+v.x).toFixed(2)}; ${(+v.y).toFixed(2)})` : String(v);
    default: return String(v);
  }
}

function gradeCell(a) {
  if (a.status !== 'manual') return a.points != null ? String(a.points) : '—';
  const pts = h('input', { type: 'number', step: '0.5', min: '0', placeholder: 'pkt' }); pts.value = a.points ?? '';
  const cm = h('textarea', { rows: '2', placeholder: 'Komentarz' }); cm.value = a.teacher_comment ?? '';
  const st = h('span', { class: 'hint' }, a.reviewed_at ? 'ocenione' : '');
  const btn = h('button', { class: 'secondary small', type: 'button' }, 'Zapisz');
  btn.onclick = async () => {
    btn.disabled = true; st.textContent = 'Zapisywanie…';
    const upd = { points: pts.value === '' ? null : Number(pts.value), teacher_comment: cm.value.trim() || null, reviewed_at: new Date().toISOString() };
    try {
      const r = await sb.from('answers').update(upd).eq('id', a.id);
      if (r.error) throw r.error;
      Object.assign(a, upd); st.textContent = 'zapisano ✓';
    } catch (e) { st.textContent = 'Błąd: ' + friendlyError(e); }
    btn.disabled = false;
  };
  return h('div', { class: 'grade' }, pts, cm, btn, st);
}

function answersTable(list) {
  const STATUS = { correct: 'poprawnie', wrong: 'błędnie', manual: 'do oceny' };
  return table(['#', 'Pytanie', 'Odpowiedź ucznia', 'Wynik', 'Podpowiedzi', 'Czas', 'Ocena nauczyciela'], list.map((a, i) => {
    const minis = Array.isArray(a.hint_minis) ? a.hint_minis : [];
    return h('tr', {},
      h('td', {}, String(i + 1)),
      h('td', {}, plainTitle({ prompt: a.question_prompt }), a.wants_more ? h('div', {}, h('span', { class: 'badge warn' }, '★ chce więcej takich zadań')) : ''),
      h('td', { style: 'white-space:pre-wrap' }, fmtAnswer(a)),
      h('td', {}, h('span', { class: 'badge ' + (a.status === 'correct' ? 'on' : a.status === 'manual' ? 'warn' : '') }, STATUS[a.status] || a.status)),
      h('td', {}, `${toNum(a.hints_used)} z ${toNum(a.hints_total)}`,
        ...minis.map(m => h('div', { class: 'hint' }, `podp. ${m.hint}: ${m.attempts} prób${m.solved ? ' ✓' : ' ✗'}`))),
      h('td', {}, a.time_spent_s != null ? a.time_spent_s + ' s' : '—'),
      h('td', {}, gradeCell(a)));
  }));
}

function renderResults() {
  const f = RES.f;
  const uniq = key => [...new Set(RES.rows.map(r => r[key]).filter(Boolean))].sort((a, b) => String(a).localeCompare(String(b), 'pl'));
  const mkSel = (val, values, allLabel, on) => {
    const s = h('select'); s.append(h('option', { value: '' }, allLabel));
    values.forEach(v => s.append(h('option', { value: v }, v)));
    s.value = val; s.onchange = () => on(s.value); return s;
  };
  const tableHolder = h('div'), detailHolder = h('div');
  const drawTable = () => {
    const rows = RES.rows.filter(r => (!f.quiz || r.quiz_title === f.quiz) && (!f.cls || r.class_name === f.cls)
      && (!f.q || `${r.student_name} ${r.student_login}`.toLowerCase().includes(f.q.toLowerCase()))
      && (!f.hints || toNum(r.hints_used) > 0) && (!f.more || toNum(r.wants_more) > 0));
    tableHolder.replaceChildren(rows.length
      ? table(['Uczeń', 'Klasa', 'Zestaw', 'Rozpoczęto', 'Status', 'Poprawne', 'Błędne', 'Do oceny', 'Podpowiedzi', 'Chce więcej'], rows.map(r => {
          const tr = h('tr', { class: 'click' + (RES.open && RES.open.attempt_id === r.attempt_id ? ' sel' : ''), onclick: () => openAttempt(r) },
            h('td', {}, r.student_name || r.student_login || '—'), h('td', {}, r.class_name || '—'), h('td', {}, r.quiz_title),
            h('td', {}, fmtDT(r.started_at)), h('td', {}, r.finished_at ? 'ukończony' : 'w toku'),
            h('td', {}, String(toNum(r.correct))), h('td', {}, String(toNum(r.wrong))), h('td', {}, String(toNum(r.manual))),
            h('td', {}, `${toNum(r.hints_used)} z ${toNum(r.hints_available)}`),
            h('td', {}, toNum(r.wants_more) ? h('span', { class: 'badge warn' }, '★ ' + toNum(r.wants_more)) : '—'));
          return tr;
        }))
      : h('p', { class: 'hint' }, RES.rows.length ? 'Brak wyników dla wybranych filtrów.' : 'Nikt jeszcze nie rozwiązywał zestawów.'));
  };
  const drawDetail = () => {
    detailHolder.replaceChildren();
    const r = RES.open; if (!r) return;
    const card = h('div', { class: 'card detail' },
      h('h3', { style: 'margin-top:0' }, `${r.student_name || r.student_login} – ${r.quiz_title}`),
      h('div', { class: 'meta' }, `Rozpoczęto: ${fmtDT(r.started_at)} · ${r.finished_at ? 'zakończono: ' + fmtDT(r.finished_at) : 'w toku'} · użyte podpowiedzi: ${toNum(r.hints_used)} z ${toNum(r.hints_available)}`));
    if (!RES.answers) card.append(loadingBox());
    else if (RES.answers.error) card.append(errBox(RES.answers.error));
    else if (!RES.answers.data.length) card.append(h('p', { class: 'hint' }, 'Brak zapisanych odpowiedzi.'));
    else card.append(answersTable(RES.answers.data));
    detailHolder.append(card);
  };
  async function openAttempt(r) {
    RES.open = r; RES.answers = null; drawTable(); drawDetail();
    const a = await sb.from('answers').select('*').eq('attempt_id', r.attempt_id).order('created_at', { ascending: true });
    if (RES.open !== r) return;
    RES.answers = a.error ? { error: a.error } : { data: a.data };
    drawDetail();
  }

  const qInp = h('input', { type: 'text', placeholder: 'Szukaj ucznia…' }); qInp.value = f.q;
  qInp.addEventListener('input', () => { f.q = qInp.value; drawTable(); });
  const moreCb = h('input', { type: 'checkbox' }); moreCb.checked = f.more;
  moreCb.onchange = () => { f.more = moreCb.checked; drawTable(); };
  const hintsCb = h('input', { type: 'checkbox' }); hintsCb.checked = f.hints;
  hintsCb.onchange = () => { f.hints = hintsCb.checked; drawTable(); };
  const filters = h('div', { class: 'filters' },
    mkSel(f.quiz, uniq('quiz_title'), 'Wszystkie zestawy', v => { f.quiz = v; drawTable(); }),
    mkSel(f.cls, uniq('class_name'), 'Wszystkie klasy', v => { f.cls = v; drawTable(); }),
    qInp, h('label', {}, hintsCb, 'tylko z użytymi podpowiedziami'), h('label', {}, moreCb, 'tylko z prośbą o więcej zadań'),
    h('button', { class: 'secondary small', type: 'button', onclick: showResults }, 'Odśwież'));
  resultsEl.replaceChildren(h('div', { class: 'card' }, filters, tableHolder), detailHolder);
  drawTable(); drawDetail();
}

/* ==========================================================================
   NAUCZYCIEL: uczniowie
   ========================================================================== */
const LOGIN_OK = /^[a-z0-9._-]{3,40}$/;
function genPassword(len = 10) {
  const A = 'abcdefghijkmnpqrstuvwxyz23456789';      // bez znaków łatwych do pomylenia (0/o, 1/l)
  const b = new Uint8Array(len); crypto.getRandomValues(b);
  return [...b].map(x => A[x % A.length]).join('');
}
async function manageStudents(body) {
  const { data, error } = await sb.functions.invoke('manage-students', { body });
  if (error) {
    let m = '';
    try { const j = await error.context.json(); m = j.error || ''; } catch (e) { /* brak treści */ }
    if (/not found|404/i.test(String(error.message)) && !m)
      m = 'Nie znaleziono funkcji „manage-students”. Wdróż ją w Supabase (Edge Functions) zgodnie z instrukcją.';
    throw new Error(m || error.message);
  }
  if (data && data.error) throw new Error(data.error);
  return data;
}
const csvCell = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
function downloadCreds(rows) {
  const csv = '﻿' + [['Login', 'Hasło', 'Imię i nazwisko', 'Klasa'], ...rows.map(r => [r.login, r.password, r.full_name, r.class_name])]
    .map(r => r.map(csvCell).join(';')).join('\r\n');
  const a = h('a', { href: URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })), download: 'dane-logowania-uczniow.csv' });
  document.body.append(a); a.click(); a.remove();
}

const STU = { rows: [], creds: null, draft: '', cls: '' };

async function showStudents() {
  studentsEl.replaceChildren(loadingBox());
  try {
    const r = await sb.from('profiles').select('id,full_name,login,class_name,active,created_at').eq('role', 'student')
      .order('class_name', { ascending: true }).order('full_name', { ascending: true });
    if (r.error) throw r.error;
    STU.rows = r.data;
  } catch (e) { studentsEl.replaceChildren(errBox(e)); return; }
  renderStudents();
}

function addStudentsCard() {
  const msg = h('div', { class: 'note', hidden: '' });
  const say = (t, k = '') => { msg.hidden = !t; msg.className = 'note ' + k; msg.textContent = t || ''; };
  const ta = h('textarea', { rows: '5', placeholder: '2a01\n2a02\n2a03' }); ta.value = STU.draft;
  ta.addEventListener('input', () => { STU.draft = ta.value; });
  const cls = h('input', { type: 'text', placeholder: 'np. 2A' }); cls.value = STU.cls;
  cls.addEventListener('input', () => { STU.cls = cls.value; });
  const btn = h('button', { class: 'primary', type: 'button' }, 'Utwórz konta');
  btn.onclick = async () => {
    const lines = ta.value.split('\n').map(x => x.trim()).filter(Boolean);
    if (!lines.length) { say('Wpisz co najmniej jedną nazwę użytkownika (każda w osobnej linii).', 'bad'); return; }
    if (lines.length > 100) { say('Jednorazowo można utworzyć najwyżej 100 kont.', 'bad'); return; }
    const taken = new Set(STU.rows.map(x => x.login).filter(Boolean)), seen = new Set(), bad = [], list = [];
    for (const line of lines) {
      const [lg, ...rest] = line.split(/[;\t,]/);
      const login = lg.trim().toLowerCase();
      if (!LOGIN_OK.test(login)) bad.push(`„${lg.trim()}” – dozwolone 3–40 znaków: a–z, 0–9, kropka, myślnik, podkreślnik`);
      else if (taken.has(login) || seen.has(login)) bad.push(`„${login}” – taka nazwa już istnieje lub się powtarza`);
      else { seen.add(login); list.push({ full_name: rest.join(' ').trim(), class_name: cls.value.trim(), login, password: genPassword() }); }
    }
    if (bad.length) { say('Popraw listę: ' + bad.join('; ') + '.', 'bad'); return; }
    btn.disabled = true; say('Tworzenie kont…');
    try {
      const { results } = await manageStudents({ action: 'create', students: list });
      const byLogin = new Map(list.map(s => [s.login, s]));
      const done = results.filter(r => r.ok).map(r => byLogin.get(r.login));
      const failed = results.filter(r => !r.ok);
      STU.creds = done.length ? { rows: done } : null;
      STU.draft = failed.map(f => f.login).join('\n');
      if (!failed.length) STU.cls = '';
      STU.failed = failed.map(f => `${f.login}: ${f.error}`);
      await showStudents();
    } catch (e) { btn.disabled = false; say('Nie udało się utworzyć kont: ' + friendlyError(e), 'bad'); }
  };
  return h('div', { class: 'card' }, h('h3', { style: 'margin-top:0' }, 'Dodaj uczniów'), msg,
    field('Nazwy użytkowników (jedna w linii)', ta, 'Wpisz własne kody, np. 2a01. Dozwolone: małe litery bez polskich znaków, cyfry, kropka, myślnik, podkreślnik (3–40 znaków). Hasło jest losowe. Opcjonalnie możesz dopisać po średniku imię i nazwisko, np. 2a01;Jan Kowalski.'),
    field('Klasa (opcjonalnie, dla wszystkich z listy)', cls),
    h('div', { class: 'rowbtns' }, btn));
}

function credsCard() {
  const c = STU.creds; if (!c) return '';
  return h('div', { class: 'card' },
    h('div', { class: 'note good' }, `Utworzono kont: ${c.rows.length}. Hasła widać tylko teraz – zapisz je lub pobierz plik, bo później nie da się ich odczytać (można je tylko zresetować).`),
    table(['Login', 'Hasło', 'Imię i nazwisko', 'Klasa'], c.rows.map(r => h('tr', {},
      h('td', {}, h('code', {}, r.login)), h('td', {}, h('code', {}, r.password)), h('td', {}, r.full_name || '—'), h('td', {}, r.class_name || '—')))),
    h('div', { class: 'rowbtns' },
      h('button', { class: 'primary', type: 'button', onclick: () => downloadCreds(c.rows) }, 'Pobierz jako plik CSV'),
      h('button', { class: 'secondary', type: 'button', onclick: () => { STU.creds = null; renderStudents(); } }, 'Ukryj hasła')));
}

function renderStudents() {
  const out = [];
  if (STU.failed && STU.failed.length) {
    out.push(h('div', { class: 'note bad' }, 'Nie udało się utworzyć: ' + STU.failed.join(' · ') + ' (te osoby zostały na liście do ponowienia).'));
    STU.failed = null;
  }
  out.push(credsCard(), addStudentsCard());
  const rows = STU.rows.map(s => {
    const st = h('span', { class: 'hint' });
    const name = h('input', { type: 'text', placeholder: 'Imię i nazwisko' }); name.value = s.full_name || '';
    const cls = h('input', { type: 'text', placeholder: 'np. 2A' }); cls.value = s.class_name || '';
    const act = h('input', { type: 'checkbox' }); act.checked = !!s.active;
    const save = async () => {
      st.textContent = 'Zapisywanie…';
      const upd = { full_name: name.value.trim(), class_name: cls.value.trim() || null, active: act.checked };
      try {
        const u = await sb.from('profiles').update(upd).eq('id', s.id);
        if (u.error) throw u.error;
        Object.assign(s, upd); st.textContent = 'zapisano ✓';
      } catch (e) { st.textContent = 'Błąd: ' + friendlyError(e); }
    };
    name.addEventListener('change', save); cls.addEventListener('change', save); act.addEventListener('change', save);
    const reset = h('button', { class: 'secondary small', type: 'button', onclick: async () => {
      if (!confirm(`Ustawić nowe hasło dla: ${s.login}?`)) return;
      const password = genPassword(); st.textContent = 'Zmiana hasła…';
      try {
        await manageStudents({ action: 'reset_password', id: s.id, password });
        STU.creds = { rows: [{ full_name: s.full_name, class_name: s.class_name, login: s.login, password }] };
        renderStudents(); window.scrollTo({ top: 0 });
      } catch (e) { st.textContent = 'Błąd: ' + friendlyError(e); }
    } }, 'Nowe hasło');
    const del = h('button', { class: 'secondary small danger', type: 'button', onclick: async () => {
      if (!confirm(`Usunąć konto: ${s.login}? Razem z nim zniknie cała historia jego wyników. Tej operacji nie można cofnąć (jeśli chcesz tylko zablokować logowanie, odznacz „Aktywny”).`)) return;
      st.textContent = 'Usuwanie…';
      try { await manageStudents({ action: 'delete', id: s.id }); await showStudents(); }
      catch (e) { st.textContent = 'Błąd: ' + friendlyError(e); }
    } }, 'Usuń');
    return h('tr', {}, h('td', {}, s.login || '—'), h('td', {}, name), h('td', {}, cls), h('td', {}, act), h('td', {}, reset, ' ', del), h('td', {}, st));
  });
  out.push(h('div', { class: 'card' }, rows.length ? table(['Login', 'Imię i nazwisko', 'Klasa', 'Aktywny', '', ''], rows)
    : h('p', { class: 'hint' }, 'Nie ma jeszcze żadnych uczniów. Dodaj pierwszych powyżej.')));
  studentsEl.replaceChildren(...out);
}

async function boot() {
  const params = new URLSearchParams(location.search);
  if (params.get('tryb') === 'lokalny' || !CLOUD.url) return enterLocal();
  try {
    const { createClient } = await import(CLOUD.lib);
    sb = createClient(CLOUD.url, CLOUD.key);
  } catch (e) {
    console.warn('Biblioteka Supabase niedostępna:', e);
    return showLogin('Nie udało się załadować biblioteki Supabase (sprawdź internet). Możesz użyć trybu lokalnego.');
  }
  try {
    const { data } = await sb.auth.getSession();
    if (data && data.session) return enterApp(data.session.user);
  } catch (e) { console.warn('Odczyt sesji nie powiódł się:', e); }
  showLogin();
}
await boot();
</script>
